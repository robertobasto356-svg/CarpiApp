name: carpiapp
description: "CARPIAPP - aplicación de carpintería para carpinteros y clientes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    # Agrega estas líneas solo cuando las carpetas existan y tengan archivos,
    # si no, Flutter marca error al compilar:
    # - assets/images/
    # - assets/products/
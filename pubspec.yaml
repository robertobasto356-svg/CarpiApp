name: carpiapp
description: "CarpiApp: gestión y cotización de muebles para carpinterías y sus clientes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3
  google_mlkit_image_labeling: ^1.0.3
  sensors_plus: ^7.1.1
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/modelos/
